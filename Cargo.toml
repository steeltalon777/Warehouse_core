[workspace]
resolver = "2"
members = [
    "crates/warehouse_core",
    "crates/warehouse_ffi",
    "crates/warehouse_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/anomalyco/warehouse-solution"
authors = ["Warehouse Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
wiremock = "0.6"
